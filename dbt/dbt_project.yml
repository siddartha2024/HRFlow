name: hrflow
version: "1.0.0"
config-version: 2

profile: hrflow

model-paths:    ["models"]
snapshot-paths: ["snapshots"]
test-paths:     ["tests"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]

target-path:  "target"
clean-targets: ["target", "dbt_packages"]

# Model materialisations — configured per layer.
# Staging views are free (no storage). Intermediates and marts are tables.
# Models are added in Stages 4-7.
models:
  hrflow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

snapshots:
  hrflow:
    +target_schema: main
